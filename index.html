          <script>
                  var observer = new MutationObserver(function(mutations, obs) {
                            var app = document.querySelector('.app');
                            if (app && !document.querySelector('.brand-header')) {
                                        var header = document.createElement('div');
                                        header.className = 'brand-header';
                                        header.innerHTML = '<div class="brand-logo"><span class="brand-bar"></span><span>PONY CHUNG<span class="brand-sub">FOUNDATION</span></span><span class="brand-bar"></span></div>';
                                        app.insertBefore(header, app.firstChild);
                                        var footer = document.createElement('div');
                                        footer.className = 'brand-footer';
                                        footer.textContent = 'FOMA';
                                        app.appendChild(footer);
                                        obs.disconnect();
                            }
                  });
                  observer.observe(document.body, {childList: true, subtree: true});
          </script>
